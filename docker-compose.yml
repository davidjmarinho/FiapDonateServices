name: fiapdonate

services:
  fiapdonate-services:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapdonate-services
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CampaignApi__BaseUrl: http://fiapdonate-campaign:8080
      UsersApi__BaseUrl: http://fiapdonate-users:8080
      ReceiverApi__BaseUrl: http://fiapdonate-receiver:8080
      WorkerApi__BaseUrl: http://fiapdonate-worker:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    ports:
      - "8090:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    networks:
      - fiapdonate-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapdonate-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
    secrets:
      - sqlserver_sa_password
    command:
      - /bin/bash
      - -c
      - |
        export MSSQL_SA_PASSWORD="$(cat /run/secrets/sqlserver_sa_password)"
        exec /opt/mssql/bin/sqlservr
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$(cat /run/secrets/sqlserver_sa_password)\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - fiapdonate-network

  postgres:
    image: postgres:16
    container_name: fiapdonate-postgres
    environment:
      POSTGRES_DB: conexao_solidaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conexao_solidaria"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fiapdonate-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fiapdonate-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    command:
      - /bin/sh
      - -c
      - |
        export RABBITMQ_DEFAULT_USER="$(cat /run/secrets/rabbitmq_user)"
        export RABBITMQ_DEFAULT_PASS="$(cat /run/secrets/rabbitmq_password)"
        exec docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fiapdonate-network

  rabbitmq-init:
    image: curlimages/curl:8.10.1
    container_name: fiapdonate-rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    volumes:
      - ./rabbitmq/init.sh:/init.sh:ro
    command: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - fiapdonate-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fiapdonate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - fiapdonate-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fiapdonate-grafana
    ports:
      - "3000:3000"
    secrets:
      - grafana_admin_password
    command:
      - /bin/sh
      - -c
      - |
        export GF_SECURITY_ADMIN_USER="admin"
        export GF_SECURITY_ADMIN_PASSWORD="$(cat /run/secrets/grafana_admin_password)"
        exec /run.sh
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - fiapdonate-network

secrets:
  rabbitmq_user:
    file: ./secrets/rabbitmq_user.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  sqlserver_sa_password:
    file: ./secrets/sqlserver_sa_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  sqlserver-data:
  postgres-data:

networks:
  fiapdonate-network:
    driver: bridge
