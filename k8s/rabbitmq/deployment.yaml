apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fiapdonate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/lib/rabbitmq
              chmod 700 /var/lib/rabbitmq
              chown -R 999:999 /var/lib/rabbitmq
              if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then chmod 600 /var/lib/rabbitmq/.erlang.cookie; fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef:
                  name: fiapdonate-services-config
                  key: RabbitMQ__User
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: fiapdonate-secrets
                  key: RabbitMQ__Password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: fiapdonate-secrets
                  key: RABBITMQ_ERLANG_COOKIE
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: rabbitmq-data
          emptyDir: {}
        - name: rabbitmq-definitions
          configMap:
            name: rabbitmq-definitions
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fiapdonate
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
  namespace: fiapdonate
data:
  definitions.json: |
    {
      "vhosts": [{"name": "/"}],
      "queues": [{"name": "doacao-recebida-queue", "vhost": "/", "durable": true, "auto_delete": false, "arguments": {}}],
      "exchanges": [{"name": "FiapDonateWorker.Api.Events:DoacaoRecebidaEvent", "vhost": "/", "type": "fanout", "durable": true, "auto_delete": false, "internal": false, "arguments": {}}],
      "bindings": [{"source": "FiapDonateWorker.Api.Events:DoacaoRecebidaEvent", "vhost": "/", "destination": "doacao-recebida-queue", "destination_type": "queue", "routing_key": "", "arguments": {}}]
    }
