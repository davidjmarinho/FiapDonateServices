apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapdonate-users-config
  namespace: fiapdonate
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Jwt__Issuer: FiapDonateCampaign
  Jwt__Audience: FiapDonateCampaignUsers
  ConnectionStrings__DefaultConnection: Server=sqlserver;Database=FiapDonateDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapdonate-users
  namespace: fiapdonate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiapdonate-users
  template:
    metadata:
      labels:
        app: fiapdonate-users
    spec:
      initContainers:
        - name: wait-for-sqlserver
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z sqlserver 1433; do echo "waiting for sqlserver"; sleep 2; done
      containers:
        - name: users
          image: davidjmarinho/fiapdonateusers:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fiapdonate-users-config
            - secretRef:
                name: fiapdonate-users-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fiapdonate-users
  namespace: fiapdonate
spec:
  selector:
    app: fiapdonate-users
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
