apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fiapdonate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          ports:
            - containerPort: 9090
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fiapdonate
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fiapdonate
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'fiapdonate-services'
        metrics_path: /metrics
        static_configs:
          - targets: ['fiapdonate-services:8080']
      - job_name: 'fiapdonate-worker'
        metrics_path: /metrics
        static_configs:
          - targets: ['fiapdonate-worker:8080']
      - job_name: 'fiapdonate-receiver'
        metrics_path: /metrics
        static_configs:
          - targets: ['fiapdonate-receiver:8080']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
