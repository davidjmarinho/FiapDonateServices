services:
  fiapdonatecampaign:
    profiles: ["integrations"]
    build:
      context: ../FiapDonateCampaign
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: FiapDonateCampaign
      Jwt__Audience: FiapDonateCampaignUsers
    entrypoint:
      - /bin/sh
      - -c
      - |
        export ConnectionStrings__DefaultConnection="Server=sqlserver,1433;Database=FiapDonateDb;User Id=sa;Password=$(cat /run/secrets/sqlserver_sa_password);TrustServerCertificate=True;"
        export Jwt__Key="$(cat /run/secrets/campaign_jwt_key)"
        exec dotnet FiapDonateCampaign.API.dll
    secrets:
      - sqlserver_sa_password
      - campaign_jwt_key
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fiapdonate-network

  fiapdonate-worker:
    profiles: ["integrations"]
    build:
      context: ../FiapDonateWorker
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: fiapdonate
    entrypoint:
      - /bin/sh
      - -c
      - |
        export RabbitMq__Password="$(cat /run/secrets/rabbitmq_password)"
        export ConnectionStrings__WorkerDb="Server=sqlserver,1433;Database=conexao_solidaria;User Id=sa;Password=$(cat /run/secrets/sqlserver_sa_password);TrustServerCertificate=True;"
        exec dotnet FiapDonateWorker.Api.dll
    secrets:
      - rabbitmq_password
      - sqlserver_sa_password
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
    networks:
      - fiapdonate-network

  fiapdonate-receiver:
    profiles: ["integrations"]
    build:
      context: ../FiapDonateReceiver
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: fiapdonate
    entrypoint:
      - /bin/sh
      - -c
      - |
        export RabbitMq__Password="$(cat /run/secrets/rabbitmq_password)"
        export ConnectionStrings__ReceiverDb="Host=postgres;Port=5432;Database=conexao_solidaria;Username=postgres;Password=$(cat /run/secrets/postgres_password)"
        exec dotnet FiapDonateReceiver.Worker.dll
    secrets:
      - rabbitmq_password
      - postgres_password
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - fiapdonate-network
