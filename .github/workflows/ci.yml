name: FiapDonateServices CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FiapDonateServices.sln

      - name: Build
        run: dotnet build FiapDonateServices.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FiapDonateServices.sln --configuration Release --no-build --verbosity minimal

      - name: Docker build
        run: docker build -t fiapdonateservices:ci .

      - name: Publish image (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GHCR_TOKEN != ''
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker tag fiapdonateservices:ci ghcr.io/${{ github.repository_owner }}/fiapdonateservices:latest
          docker push ghcr.io/${{ github.repository_owner }}/fiapdonateservices:latest
