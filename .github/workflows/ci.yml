name: FiapDonateServices CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-deploy-k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NAMESPACE: fiapdonate
      CLUSTER_NAME: fiapdonate-ci

    steps:
      - name: Checkout FiapDonateServices
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore FiapDonateServices.sln

      - name: Build solution
        run: dotnet build FiapDonateServices.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test FiapDonateServices.sln --configuration Release --no-build --verbosity minimal

      - name: Checkout sibling repo images for the full cluster
        env:
          GITHUB_ORG: ${{ vars.FIAPDONATE_GITHUB_ORG || github.repository_owner }}
        run: |
          set -euo pipefail
          for repo in FiapDonateUsers FiapDonateCampaign FiapDonateReceiver FiapDonateWorker; do
            if [ -d "../${repo}" ] && [ -f "../${repo}/Dockerfile" ]; then
              echo "Repository ${repo} already present locally; skipping clone."
              continue
            fi
            if git ls-remote --exit-code "https://github.com/${GITHUB_ORG}/${repo}.git" >/dev/null 2>&1; then
              git clone --depth 1 "https://github.com/${GITHUB_ORG}/${repo}.git" "../${repo}"
            else
              echo "Skipping ${repo}: repository not available in ${GITHUB_ORG}."
            fi
          done

      - name: Build Docker images for the cluster
        run: |
          set -euo pipefail
          docker build -t fiapdonateservices:latest .

          for pair in \
            "FiapDonateCampaign|fiapdonatecampaign:local" \
            "FiapDonateWorker|fiapdonateworker:local" \
            "FiapDonateReceiver|fiapdonatereceiver:local" \
            "FiapDonateUsers|fiapdonateusers:local"; do
            repo="${pair%%|*}"
            tag="${pair##*|}"
            dir="../${repo}"
            if [ -d "$dir" ] && [ -f "$dir/Dockerfile" ]; then
              echo "Building ${tag} from ${dir}"
              docker build -t "$tag" "$dir"
            else
              echo "Skipping ${tag}: Dockerfile not found in ${dir}"
            fi
          done

      - name: Install kind and kubectl
        run: |
          set -euo pipefail
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Create local Kubernetes cluster
        run: |
          set -euo pipefail
          cat > kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
          EOF

          kind create cluster --name "$CLUSTER_NAME" --config kind-config.yaml
          kubectl cluster-info
          kubectl get nodes

      - name: Load built images into kind
        run: |
          set -euo pipefail
          kind load docker-image fiapdonateservices:latest --name "$CLUSTER_NAME"
          for image in fiapdonatecampaign:local fiapdonateworker:local fiapdonatereceiver:local fiapdonateusers:local; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              kind load docker-image "$image" --name "$CLUSTER_NAME"
            else
              echo "Skipping image ${image}: not built or not available."
            fi
          done

      - name: Deploy Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -R -f k8s/
          kubectl get ns "$NAMESPACE"
          kubectl get all -n "$NAMESPACE"

      - name: Wait for deployments and services
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deployment/fiapdonate-services --timeout=180s || true
          kubectl -n "$NAMESPACE" rollout status deployment/fiapdonatecampaign --timeout=180s || true
          kubectl -n "$NAMESPACE" rollout status deployment/fiapdonate-worker --timeout=180s || true
          kubectl -n "$NAMESPACE" rollout status deployment/fiapdonate-receiver --timeout=180s || true
          kubectl -n "$NAMESPACE" rollout status deployment/fiapdonate-users --timeout=180s || true
          kubectl -n "$NAMESPACE" rollout status deployment/prometheus --timeout=180s || true
          kubectl -n "$NAMESPACE" rollout status deployment/rabbitmq --timeout=180s || true
          kubectl -n "$NAMESPACE" rollout status deployment/grafana --timeout=180s || true

      - name: Smoke test the stack
        run: |
          set -euo pipefail
          kubectl get pods -n "$NAMESPACE"
          kubectl get svc -n "$NAMESPACE"

          kubectl port-forward -n "$NAMESPACE" svc/fiapdonate-services 8080:8080 >/tmp/fiapdonate-services.log 2>&1 &
          kubectl port-forward -n "$NAMESPACE" svc/prometheus 9090:9090 >/tmp/prometheus.log 2>&1 &
          kubectl port-forward -n "$NAMESPACE" svc/rabbitmq 15672:15672 >/tmp/rabbitmq.log 2>&1 &

          sleep 15

          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:9090/-/healthy
          curl -fsS -u guest:guest http://127.0.0.1:15672/api/health/checks/alarms

      - name: Publish Docker image for main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GHCR_TOKEN != ''
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker tag fiapdonateservices:latest ghcr.io/${{ github.repository_owner }}/fiapdonateservices:latest
          docker push ghcr.io/${{ github.repository_owner }}/fiapdonateservices:latest
